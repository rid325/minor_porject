name: Prototype checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest -q backend/tests
      - run: npm ci && npm run lint && npm run build
        working-directory: frontend
      - run: npx playwright-core install --with-deps chromium
        working-directory: frontend
      - name: Exercise the guest profile and scheme catalogue
        run: |
          python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 &
          npm --prefix frontend run start -- --hostname 127.0.0.1 --port 3000 &
          curl --retry 20 --retry-delay 1 --retry-connrefused --fail -s http://127.0.0.1:8000/api/v1/health > /dev/null
          curl --retry 20 --retry-delay 1 --retry-connrefused --fail -s http://127.0.0.1:3000/profile > /dev/null
          npm --prefix frontend run test:journey
